<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password — Xolani Driving School</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-left">
    <a href="/" class="nav-logo" style="margin-bottom:auto">
      <div class="nav-logo-icon">X</div>
      <div class="nav-logo-text"><div class="brand-main" style="color:#fff">Xolani Driving School</div><div class="brand-sub">KwaZulu-Natal</div></div>
    </a>
    <div style="position:relative;z-index:2;margin:48px 0">
      <div style="font-size:3.5rem;margin-bottom:20px">🔑</div>
      <h2 style="color:#fff;font-size:1.8rem;margin-bottom:12px">Create New Password</h2>
      <p style="color:rgba(255,255,255,.65);font-size:.92rem;line-height:1.7">Enter your new password below to reset your account.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrap">
      <h1 class="auth-title">New Password</h1>
      <p class="auth-sub">Choose a strong password.</p>

      <div class="alert alert-error" id="reset-error" style="display:none"></div>
      <div class="alert alert-success" id="reset-success" style="display:none"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">New Password <span class="req">*</span></label>
          <div style="position:relative">
            <input type="password" name="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8" style="padding-right:42px">
            <!-- ⭐ REMOVED onclick, added data-toggle-pw -->
            <button type="button" data-toggle-pw="password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password <span class="req">*</span></label>
          <div style="position:relative">
            <input type="password" name="confirm_password" id="confirm-password" class="form-control" placeholder="Repeat password" required style="padding-right:42px">
            <!-- ⭐ REMOVED onclick, added data-toggle-pw -->
            <button type="button" data-toggle-pw="confirm-password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <!-- Password strength -->
        <div style="margin-bottom:16px">
          <div style="display:flex;gap:4px;margin-bottom:4px">
            <div class="pw-bar" style="flex:1;height:4px;border-radius:2px;background:var(--gray-100)" id="pb1"></div>
            <div class="pw-bar" style="flex:1;height:4px;border-radius:2px;background:var(--gray-100)" id="pb2"></div>
            <div class="pw-bar" style="flex:1;height:4px;border-radius:2px;background:var(--gray-100)" id="pb3"></div>
            <div class="pw-bar" style="flex:1;height:4px;border-radius:2px;background:var(--gray-100)" id="pb4"></div>
          </div>
          <div id="pw-strength-label" style="font-size:.72rem;color:var(--gray-400)">Enter a password to see strength</div>
        </div>

        <button type="submit" id="reset-btn" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-save"></i> Reset Password
        </button>
      </form>

      <div class="auth-divider">or</div>
      <a href="/auth/login.html" class="btn btn-dark btn-block"><i class="fas fa-sign-in-alt"></i> Back to Login</a>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
// ─── Password Toggle Function ──────────────────────────────
function togglePassword(inputId, btn) {
  const inp = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

// ⭐ FIX: Use event listeners instead of inline onclick
document.addEventListener('DOMContentLoaded', function() {
  // Password toggle buttons
  const toggleBtns = document.querySelectorAll('[data-toggle-pw]');
  toggleBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      const inputId = this.dataset.togglePw;
      togglePassword(inputId, this);
    });
  });
});

// Password strength
document.getElementById('password').addEventListener('input', function() {
  const v = this.value;
  const bars = [1,2,3,4].map(n => document.getElementById('pb'+n));
  const lbl = document.getElementById('pw-strength-label');
  let score = 0;
  if (v.length >= 8) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['','#dc2626','#d97706','#16a34a','#0284c7'];
  const labels = ['','Weak','Fair','Strong','Very Strong'];
  bars.forEach((b,i) => b.style.background = i < score ? colors[score] : 'var(--gray-100)');
  lbl.textContent = v.length ? labels[score] : 'Enter a password to see strength';
  lbl.style.color = colors[score] || 'var(--gray-400)');
});

// ⭐ Extract the access token from the URL
function getAccessTokenFromURL() {
  const hash = window.location.hash;
  if (!hash) return null;
  const params = new URLSearchParams(hash.substring(1));
  return params.get('access_token');
}

// ⭐ Check if the reset link is valid
function checkResetLink() {
  const errorEl = document.getElementById('reset-error');
  const accessToken = getAccessTokenFromURL();
  const hash = window.location.hash;
  
  if (hash && (hash.includes('error=access_denied') || hash.includes('otp_expired'))) {
    errorEl.textContent = 'This reset link has expired. Please request a new password reset link.';
    errorEl.style.display = 'block';
    document.getElementById('reset-btn').disabled = true;
    document.getElementById('reset-btn').innerHTML = '⚠️ Link Expired - Request New Link';
    return false;
  }
  
  if (!accessToken) {
    errorEl.textContent = 'Invalid reset link. Please request a new password reset link.';
    errorEl.style.display = 'block';
    document.getElementById('reset-btn').disabled = true;
    document.getElementById('reset-btn').innerHTML = '⚠️ Invalid Link - Request New Link';
    return false;
  }
  
  window.resetAccessToken = accessToken;
  return true;
}

document.getElementById('reset-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');
  const btn = document.getElementById('reset-btn');
  
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  if (password.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters.';
    errorEl.style.display = 'block';
    return;
  }
  
  if (password !== confirmPassword) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.style.display = 'block';
    return;
  }
  
  const accessToken = window.resetAccessToken;
  if (!accessToken) {
    errorEl.textContent = 'Invalid reset link. Please request a new password reset link.';
    errorEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Updating…';
  
  try {
    const sessionResponse = await fetch('/auth/set-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: accessToken })
    });
    
    const sessionData = await sessionResponse.json();
    if (!sessionData.success) {
      errorEl.textContent = 'Invalid or expired reset link. Please request a new one.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
      return;
    }
    
    const response = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, confirm_password: confirmPassword })
    });
    
    const data = await response.json();
    
    if (data.success) {
      successEl.textContent = data.message || 'Password updated successfully! Redirecting to login...';
      successEl.style.display = 'block';
      setTimeout(() => {
        window.location.href = '/auth/login.html?success=Password updated successfully!';
      }, 2500);
    } else {
      errorEl.textContent = data.error || 'Failed to reset password. Please try again.';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    console.error('Reset password error:', err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
  }
});

// ⭐ Check the reset link on page load
document.addEventListener('DOMContentLoaded', function() {
  checkResetLink();
  console.log('✅ Reset password page initialized');
});
</script>
</body>
</html>
