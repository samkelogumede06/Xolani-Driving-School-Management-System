<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password — Xolani Driving School</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-layout">
  <div class="auth-left">
    <a href="/" class="nav-logo" style="margin-bottom:auto">
      <div class="nav-logo-icon">X</div>
      <div class="nav-logo-text"><div class="brand-main" style="color:#fff">Xolani Driving School</div><div class="brand-sub">KwaZulu-Natal</div></div>
    </a>
    <div style="position:relative;z-index:2;margin:48px 0">
      <div style="font-size:3.5rem;margin-bottom:20px">🔐</div>
      <h2 style="color:#fff;font-size:1.8rem;margin-bottom:12px">Reset Your Password</h2>
      <p style="color:rgba(255,255,255,.65);font-size:.92rem;line-height:1.7">Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    <div class="auth-stats">
      <div><div class="auth-stat-num">2,400+</div><div class="auth-stat-lbl">Graduates</div></div>
      <div><div class="auth-stat-num">94%</div><div class="auth-stat-lbl">Pass Rate</div></div>
      <div><div class="auth-stat-num">12 Yrs</div><div class="auth-stat-lbl">Experience</div></div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrap">
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-sub">We'll send you a password reset link.</p>

      <div class="alert alert-error" id="reset-error" style="display:none"></div>
      <div class="alert alert-success" id="reset-success" style="display:none"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">Email Address <span class="req">*</span></label>
          <input type="email" name="email" id="email-input" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" id="reset-btn" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="auth-divider">or</div>
      <a href="/auth/login.html" class="btn btn-dark btn-block"><i class="fas fa-sign-in-alt"></i> Back to Login</a>
      <p style="text-align:center;margin-top:16px;font-size:.78rem;color:var(--gray-400)"><a href="/" class="auth-link" style="font-weight:500">← Back to Website</a></p>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('reset-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email-input').value.trim();
  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');
  const btn = document.getElementById('reset-btn');
  
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  if (!email) {
    errorEl.textContent = 'Please enter your email address.';
    errorEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sending…';
  
  try {
    const response = await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    
    const data = await response.json();
    
    // The server gives the same message whether or not the account exists
    if (data.success) {
      successEl.textContent = data.message + ' Check your inbox (and spam folder).';
      successEl.style.display = 'block';
      document.getElementById('email-input').value = '';
    } else {
      errorEl.textContent = data.error || 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    console.error('Forgot password error:', err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
  }
});
</script>
</body>
</html>
