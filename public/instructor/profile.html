<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instructor Profile | Xolani Driving School</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="dash-layout">
<div class="sidebar-overlay" id="sb-overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo"><div class="sidebar-logo-icon">X</div><div><div class="sidebar-brand">Xolani DS</div><div class="sidebar-role">Instructor Portal</div></div></div><button class="sidebar-close-btn" id="sb-close"><i class="fas fa-times"></i></button></div>
  <nav class="sidebar-nav">
    <div class="nav-grp-label">Work</div>
    <a href="/instructor/dashboard.html" class="nav-item"><span class="ni"><i class="fas fa-calendar-check"></i></span> Lessons</a>
    <a href="/instructor/attendance.html" class="nav-item"><span class="ni"><i class="fas fa-clipboard-check"></i></span> Attendance</a>
    <div class="nav-grp-label">Intelligence</div>
    <a href="/instructor/ai-insights.html" class="nav-item"><span class="ni"><i class="fas fa-robot"></i></span> AI Insights</a>
    <a href="/instructor/notifications.html" class="nav-item"><span class="ni"><i class="fas fa-bell"></i></span> Notifications</a>
    <div class="nav-grp-label">Account</div>
    <a href="/instructor/profile.html" class="nav-item active"><span class="ni"><i class="fas fa-user"></i></span> Profile</a>
  </nav>
  <div class="sidebar-footer"><div class="sb-user"><div class="sb-avatar" id="sb-avatar">IN</div><div><div class="sb-name" id="sb-name">Instructor</div><div class="sb-role">Instructor</div></div><a href="/auth/logout" class="sb-logout"><i class="fas fa-sign-out-alt"></i></a></div></div>
</aside>

<div class="dash-main">
  <header class="topbar">
    <div class="topbar-left"><button class="sb-toggle" id="sb-toggle"><i class="fas fa-bars"></i></button><div><div class="pg-title">My Profile</div><div class="pg-sub">Manage your personal and professional details</div></div></div>
    <div class="topbar-right">
      <div class="tb-user-btn" data-dropdown="user-dd"><div class="tb-avatar" id="tb-avatar">IN</div><span class="tb-name" id="tb-name">Instructor</span><div class="dropdown-menu" id="user-dd"><a href="/instructor/profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a><a href="/auth/logout" class="dropdown-item danger"><i class="fas fa-sign-out-alt"></i> Logout</a></div></div>
    </div>
  </header>
  <div class="page-content">
    <div class="card" style="max-width:760px;margin:0 auto">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-user-edit" style="color:var(--accent)"></i> Edit Profile</div>
        <button id="availability-toggle" class="btn btn-sm" style="background:var(--gray-50);border:1px solid var(--gray-200);color:var(--primary)"><i class="fas fa-toggle-on"></i> <span id="avail-label">Available</span></button>
      </div>
      <div class="card-body">
        <div id="profile-error" class="alert alert-error" style="display:none"></div>
        <div id="profile-success" class="alert alert-success" style="display:none"></div>

        <form id="profile-form">
          <div class="form-row">
            <div class="form-group"><label class="form-label">First Name <span class="req">*</span></label><input type="text" name="first_name" id="first-name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Last Name <span class="req">*</span></label><input type="text" name="last_name" id="last-name" class="form-control" required></div>
          </div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" id="email" class="form-control" disabled></div>
          <div class="form-group"><label class="form-label">Phone <span class="req">*</span></label><input type="tel" name="phone" id="phone" class="form-control" required></div>
          <div class="form-group"><label class="form-label">Address</label><input type="text" name="address" id="address" class="form-control" placeholder="Street address"></div>
          <div class="form-group"><label class="form-label">City</label><input type="text" name="city" id="city" class="form-control" placeholder="City"></div>
          <hr>
          <h4 style="color:var(--primary);margin-bottom:12px">Professional Details</h4>
          <div class="form-group"><label class="form-label">License Number</label><input type="text" name="license_number" id="license-number" class="form-control" placeholder="PDP/Instructor license"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">License Expiry</label><input type="date" name="license_expiry" id="license-expiry" class="form-control"></div>
            <div class="form-group"><label class="form-label">Years Experience</label><input type="number" name="years_experience" id="years-exp" class="form-control" min="0" placeholder="0"></div>
          </div>
          <div class="form-group"><label class="form-label">Bio</label><textarea name="bio" id="bio" class="form-control" rows="4" placeholder="Brief instructor bio…"></textarea></div>

          <hr>
          <h4 style="color:var(--primary);margin-bottom:12px">Change Password</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">New Password <span class="req">*</span></label>
              <div style="position:relative">
                <input type="password" name="password" id="new-password" class="form-control" placeholder="Min. 8 characters" style="padding-right:42px">
                <button type="button" id="toggle-password-btn" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password <span class="req">*</span></label>
              <div style="position:relative">
                <input type="password" name="confirm_password" id="confirm-password" class="form-control" placeholder="Repeat password" style="padding-right:42px">
                <button type="button" id="toggle-confirm-btn" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem"><i class="fas fa-eye"></i></button>
              </div>
            </div>
          </div>

          <button type="submit" id="save-profile-btn" class="btn btn-primary btn-block btn-lg"><i class="fas fa-save"></i> Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
function togglePassword(inputId, btn) {
  const inp = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}

async function loadProfile() {
  try {
    const data = await api('/api/instructor/profile');
    if (!data.success) { window.location.href = '/auth/login.html'; return; }
    
    if (data.user) {
      const u = data.user;
      const init = u.firstName[0] + u.lastName[0];
      ['sb-avatar','tb-avatar'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = init; });
      ['sb-name','tb-name'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = u.firstName + ' ' + u.lastName; });
    }

    const p = data.profile;
    document.getElementById('first-name').value = p.first_name || '';
    document.getElementById('last-name').value = p.last_name || '';
    document.getElementById('email').value = p.email || '';
    document.getElementById('phone').value = p.phone || '';
    document.getElementById('address').value = p.address || '';
    document.getElementById('city').value = p.city || '';

    const i = data.instructor;
    document.getElementById('license-number').value = i?.license_number || '';
    document.getElementById('license-expiry').value = i?.license_expiry || '';
    document.getElementById('years-exp').value = i?.years_experience || 0;
    document.getElementById('bio').value = i?.bio || '';

    const avail = i?.is_available;
    document.getElementById('avail-label').textContent = avail ? 'Available' : 'Unavailable';
    document.getElementById('availability-toggle').innerHTML = `<i class="fas fa-toggle-${avail ? 'on' : 'off'}"></i> <span id="avail-label">${avail ? 'Available' : 'Unavailable'}</span>`;
    window.currentAvailability = avail;
  } catch(err) { console.error(err); }
}

document.getElementById('availability-toggle').addEventListener('click', async function() {
  const newAvail = !window.currentAvailability;
  const data = await api('/api/instructor/availability', { body: { is_available: newAvail } });
  if (data.success) {
    window.currentAvailability = newAvail;
    document.getElementById('avail-label').textContent = newAvail ? 'Available' : 'Unavailable';
    this.innerHTML = `<i class="fas fa-toggle-${newAvail ? 'on' : 'off'}"></i> <span id="avail-label">${newAvail ? 'Available' : 'Unavailable'}</span>`;
    Toast.success(`Availability updated to ${newAvail ? 'Available' : 'Unavailable'}`);
  } else Toast.error(data.error);
});

document.getElementById('profile-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const errEl = document.getElementById('profile-error');
  const okEl = document.getElementById('profile-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const fd = new FormData(this);
  const body = Object.fromEntries(fd);
  const btn = document.getElementById('save-profile-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving…';

  try {
    const data = await api('/api/instructor/profile', { method: 'PUT', body });
    if (data.success) {
      okEl.textContent = data.message || 'Profile updated successfully!';
      okEl.style.display = 'block';
    } else {
      errEl.textContent = data.error || 'Failed to update profile.';
      errEl.style.display = 'block';
    }
  } catch(err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
});

// Password toggle buttons
document.getElementById('toggle-password-btn').addEventListener('click', function() { togglePassword('new-password', this); });
document.getElementById('toggle-confirm-btn').addEventListener('click', function() { togglePassword('confirm-password', this); });

loadProfile();
</script>
</body>
</html>
